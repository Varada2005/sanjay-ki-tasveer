<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Bhai+2:wght@500;600;700&display=swap">
<style>
  :root { --bg: #FFF6E0; --card: #fff; --ink: #2A1E12; --muted: #7A6650; --yellow: #FFC21A; --coral: #F25C3B; --line: #F0DFB8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #241A10; --card: #33261A; --ink: #FFF3DC; --muted: #CBB89A; --line: #4A3826; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.45 "Baloo 2", "Baloo Bhai 2", system-ui, sans-serif; }
  header { background: var(--yellow); color: #2A1E12; padding: 22px 16px 18px; border-radius: 0 0 28px 28px; }
  header h1 { margin: 0; font-size: 28px; font-weight: 800; }
  header p { margin: 4px 0 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px 0; max-width: 1100px; margin: 0 auto; }
  .bar button, .bar a { font: inherit; font-weight: 700; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; text-decoration: none; }
  .bar button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .item { background: var(--card); border-radius: 22px; padding: 12px; border: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .item img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; }
  .item audio { width: 100%; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--yellow); color: #2A1E12; }
  .tag.voice { background: #FFB3A3; } .tag.word { background: #9FDDC6; }
  .word { font-size: 24px; font-weight: 800; }
  small { color: var(--muted); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header><h1>Reference Library</h1><p>Voices, old objects and regional words sent in by readers. For designers and illustrators of the books.</p></header>
<div class="bar"><button data-f="all" class="on">All</button><button data-f="photo">Objects</button><button data-f="voice">Voices</button><button data-f="word">Words</button><a href="/api/contrib" download="contributions.json">Export JSON</a></div>
<main id="list"></main>
<script>
let items = [], f = 'all';
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() {
  const list = items.filter((i) => f === 'all' || i.kind === f);
  document.getElementById('list').innerHTML = list.length ? list.map((i) => `<div class="item">
    <span class="tag ${i.kind}">${{ photo: 'Object', voice: 'Voice', word: 'Word' }[i.kind]}${i.lang ? ' · ' + esc(i.lang) : ''}</span>
    ${i.kind === 'photo' ? `<a href="/contrib-files/${i.file}" target="_blank"><img src="/contrib-files/${i.file}" alt="" loading="lazy"></a>` : ''}
    ${i.kind === 'voice' ? `<audio controls preload="none" src="/contrib-files/${i.file}"></audio>` : ''}
    ${i.word ? `<div class="word">${esc(i.word)}</div>` : ''}${i.meaning ? `<div>${esc(i.meaning)}</div>` : ''}${i.note ? `<div>${esc(i.note)}</div>` : ''}
    <small>${esc([i.name, i.place].filter(Boolean).join(', '))} · ${new Date(i.at).toLocaleString()}</small></div>`).join('') : '<div class="empty">Nothing yet.</div>';
}
for (const b of document.querySelectorAll('[data-f]')) b.onclick = () => { f = b.dataset.f; document.querySelectorAll('[data-f]').forEach((x) => x.classList.toggle('on', x === b)); render(); };
fetch('/api/contrib').then((r) => r.json()).then((d) => { items = d; render(); });
</script>
</body>
</html>

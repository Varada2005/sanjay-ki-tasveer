<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanjay ki Tasveer · Host</title>
<style>
  :root { --bg:#f6efe2; --ink:#2b2118; --muted:#7a6a58; --line:#e0d2b8; --card:#fffaf0; --accent:#b4432a; --ok:#2e7d32; --soft:#d9a441; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1510; --ink:#f6ead6; --muted:#b3a38c; --line:#43362a; --card:#271f17; --accent:#ff8a65; --ok:#66bb6a; --soft:#e0b45c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0; flex:1; min-width:200px; }
  button, select, a.btn { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; text-decoration:none; }
  button.danger { color:var(--accent); border-color:var(--accent); }
  main { display:grid; grid-template-columns: minmax(280px, 380px) 1fr; gap:18px; padding:18px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  #qr { width:100%; aspect-ratio:1; background:#fff; border-radius:8px; padding:8px; }
  #qr svg { width:100%; height:100%; display:block; }
  .code { font:800 64px/1 ui-monospace, monospace; letter-spacing:.12em; text-align:center; margin:12px 0 4px; }
  .url { font:12px ui-monospace, monospace; color:var(--muted); word-break:break-all; text-align:center; }
  .players { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .player { border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; gap:10px; align-items:center; }
  .dot { width:14px; height:14px; border-radius:50%; background:#9e9e9e; flex:none; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); } .dot.taken { background:var(--soft); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; }
  .pill.yes { background:var(--ok); color:#fff; border-color:var(--ok); }
  .soft { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--soft); opacity:.75; margin-right:3px; }
  .grid2 { display:grid; grid-template-columns: 220px 1fr; gap:16px; align-items:start; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  #photo { width:100%; max-width:220px; background:#2b2118; border-radius:8px; }
  #result { font-size:18px; font-weight:700; margin-top:8px; }
  #log { max-height:420px; overflow:auto; font:12px/1.5 ui-monospace, monospace; }
  #log td { padding:3px 6px; }
  .page-teen { color:#1e88e5; } .page-dadi { color:#d81b60; }
  .flow { font:13px ui-monospace, monospace; word-break:break-all; }
  .faces { display:flex; flex-wrap:wrap; gap:8px; } .faces figure { margin:0; text-align:center; font-size:12px; color:var(--muted); } .faces img { width:64px; border-radius:6px; display:block; }
  .faces figure.right img { outline:3px solid var(--ok); } .faces figure.wrong img { outline:3px solid var(--soft); }
</style>
</head>
<body>
<header>
  <h1>Sanjay ki Tasveer · host</h1>
  <label>Phones join via <select id="base"></select></label>
  <button id="new">New room</button>
  <button id="reset" class="danger">Reset room</button>
  <button id="free" class="danger">Reset + free both phones</button>
  <a class="btn" id="export" href="#" download>Export log (JSON)</a>
</header>
<main>
  <section>
    <div class="card">
      <div id="qr"></div>
      <div class="code" id="code">····</div>
      <div class="url" id="url"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Players</h2>
      <div class="players">
        <div class="player"><i class="dot" id="dot-teen"></i><div><b>Teen</b> · jhoola page<br><small id="lang-teen"></small></div></div>
        <div class="player"><i class="dot" id="dot-dadi"></i><div><b>Dadi</b> · haat page<br><small id="lang-dadi"></small></div></div>
      </div>
    </div>
  </section>
  <section style="display:grid; gap:14px; align-content:start">
    <div class="card grid2">
      <div><canvas id="photo"></canvas></div>
      <div>
        <h2>Puzzles (Sanjay's day, in order)</h2>
        <table><thead><tr><th>#</th><th>wrapper (scan)</th><th>answer</th><th>meaning</th><th>solved</th><th>wrong</th></tr></thead><tbody id="threads"></tbody></table>
        <div id="result"></div>
        <div id="rest" style="color:var(--muted)"></div>
      </div>
    </div>
    <div class="card"><h2>Candidates · final guesses</h2><div class="faces" id="faces"></div></div>
    <div class="card"><h2>Page flow</h2><div class="flow" id="flow"></div></div>
    <div class="card"><h2>Event log</h2><div id="log"><table><tbody id="logrows"></tbody></table></div></div>
  </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { loadPhoto, drawAssembled } from '/js/photo.js';
const $ = (s) => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem('sanjay.host.' + k); } catch(e) { return null; } }, set(k,v){ try { localStorage.setItem('sanjay.host.' + k, v); } catch(e) {} } };
let META = { puzzles: [] };
const CANDS = ['sanjay','A','B','C','D','E'];
const socket = io();
let room = new URLSearchParams(location.search).get('room') || store.get('room');
let cfg = { lan: [], port: location.port };
let photo = null, last = null;

async function init() {
  cfg = await (await fetch('/api/config')).json();
  // Phones can't reach "localhost": prefer the public URL, then the laptop's LAN address.
  const isLocal = /^(localhost|127\.)/.test(location.hostname);
  const port = location.port || (location.protocol === 'https:' ? 443 : 80);
  const lanUrls = cfg.lan.map((ip) => `${location.protocol}//${ip}:${port}`);
  const opts = [...new Set((isLocal ? [cfg.publicUrl, ...lanUrls, location.origin] : [cfg.publicUrl, location.origin, ...lanUrls]).filter(Boolean))];
  $('#base').innerHTML = opts.map((o) => `<option>${o}</option>`).join('');
  const saved = store.get('base'); if (saved && opts.includes(saved)) $('#base').value = saved;
  $('#base').onchange = () => { store.set('base', $('#base').value); renderQR(); };
  META = await (await fetch('/api/host-meta')).json();
  photo = await loadPhoto().catch(() => null);
}

function watch(code) {
  socket.emit('host:watch', { room: code }, (res) => {
    if (!res.ok) return;
    room = res.room; store.set('room', room);
    history.replaceState(null, '', `/host?room=${room}`);
    $('#code').textContent = room;
    $('#export').href = `/api/rooms/${room}/export`;
    renderQR(); render(res.state);
  });
}
function renderQR() {
  if (!room) return;
  const url = `${$('#base').value}/play?room=${room}`;
  $('#url').textContent = url;
  fetch(`/api/qr.svg?text=${encodeURIComponent(url)}`).then((r) => r.text()).then((svg) => { $('#qr').innerHTML = svg; });
}

const time = (t) => new Date(t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
function describe(e) {
  const bits = [e.puzzleId, e.regionId, e.code ? 'code ' + e.code : '', e.kind, e.piece ? 'piece ' + e.piece : '', e.next ? 'next → ' + e.next : '', e.wrong ? 'miss ' + e.wrong + (e.wrong >= 3 ? ' (picture clue)' : '') : '', e.candidateId ? 'man ' + e.candidateId : '', e.lang, e.first === false ? '(again)' : ''];
  return bits.filter(Boolean).join(' · ');
}

function render(s) {
  last = s;
  for (const r of ['teen','dadi']) {
    const p = s.players[r];
    $('#dot-' + r).className = 'dot' + (p.connected ? ' on' : p.taken ? ' taken' : '');
    $('#lang-' + r).textContent = p.taken ? `${p.connected ? 'connected' : 'away'} · ${p.lang}` : 'free';
  }
  $('#threads').innerHTML = META.puzzles.map((p) => {
    const a = s.attempts[p.id] || { wrong: 0 };
    const seen = s.seen.includes(p.id), solved = s.solved.includes(p.id);
    return `<tr><td>${p.id.slice(1)}</td><td><span class="pill ${seen ? 'yes' : ''}">${seen ? 'open' : '—'}</span> ${p.place} (${p.page === 'teen' ? 'T' : 'D'})</td>
      <td><b>${p.answer}</b></td><td style="font-size:12px;color:var(--muted)">${p.meaning}</td>
      <td><span class="pill ${solved ? 'yes' : ''}">${solved ? s.solvedDetail[p.id].by : '—'}</span></td>
      <td>${'<i class="soft"></i>'.repeat(Math.min(a.wrong, 12))}</td></tr>`;
  }).join('');
  $('#result').textContent = s.won ? `Sanjay found by ${s.won.by} at ${time(s.won.at)} with ${s.pieces.length}/6 pieces` : `${s.pieces.length}/6 pieces · wrong guesses this round: ${s.wrongGuesses}`;
  $('#rest').textContent = s.resting ? `Resting (diya) · ${Math.ceil(s.restRemainingMs / 1000)} s left` : '';
  const g = {}; for (const x of s.guesses) (g[x.candidateId] = g[x.candidateId] || []).push(x);
  $('#faces').innerHTML = CANDS.map((c) => `<figure class="${g[c] ? (c === 'sanjay' ? 'right' : 'wrong') : ''}"><img src="/assets/faces/${c}.svg" alt="${c}"><figcaption>${c}${g[c] ? ' ×' + g[c].length : ''}</figcaption></figure>`).join('')
    + Object.keys(g).filter((c) => c.startsWith('other_')).map((c) => `<figure class="wrong"><img src="/assets/faces/other.svg"><figcaption>${c} ×${g[c].length}</figcaption></figure>`).join('');
  const acts = s.log.filter((e) => ['puzzle_open','solved','code_wrong','guess_wrong','guess_right'].includes(e.type));
  $('#flow').innerHTML = acts.map((e) => `<span class="page-${e.role}">${e.role === 'teen' ? 'T' : 'D'}</span>`).join('→') || '—';
  $('#logrows').innerHTML = s.log.slice().reverse().map((e) => `<tr><td>${time(e.t)}</td><td class="page-${e.role || ''}">${e.role || ''}</td><td>${e.type}</td><td>${describe(e)}</td></tr>`).join('');
  if (photo) { const cv = $('#photo'); cv.width = photo.W; cv.height = photo.H; drawAssembled(cv.getContext('2d'), photo, s.pieces); }
}

socket.on('host:state', render);
socket.on('connect', () => { if (room) watch(room); });
$('#new').onclick = () => socket.emit('host:new', {}, (res) => watch(res.room));
$('#reset').onclick = () => { if (confirm(`Reset progress in room ${room}? Phones stay joined.`)) socket.emit('host:reset', { room }); };
$('#free').onclick = () => { if (confirm(`Reset room ${room} AND free both roles? Phones go back to the join screen.`)) socket.emit('host:reset', { room, freeRoles: true }); };
setInterval(() => { if (last && last.resting) { last.restRemainingMs = Math.max(0, last.restRemainingMs - 1000); $('#rest').textContent = `Resting (diya) · ${Math.ceil(last.restRemainingMs / 1000)} s left`; } }, 1000);

await init();
if (room) watch(room); else socket.emit('host:new', {}, (res) => watch(res.room));
</script>
</body>
</html>
